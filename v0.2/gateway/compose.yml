# dt-gateway: the ingestion gateway. It connects to dt-broker (BROKER_HOST), like every other
# part; it runs no broker of its own. On its own, or in dev/compose.yml on a laptop.
#
# On its own (from gateway/):   copy .env.example to .env, set the passwords, then
#   docker compose up -d --build
#   docker compose logs -f gateway
#
# Build context is v0.2/ (".."), so the image can include ../common. After the repo split
# the Dockerfile installs dtteo-common from git instead (common/README.md).

name: dt-gateway

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    environment:
      # Default: the broker on this same machine (dt-broker publishes port 1883 here).
      BROKER_HOST: ${BROKER_HOST:-host.docker.internal}
      GATEWAY_SITE: site1
      GATEWAY_ENABLED: ${GATEWAY_ENABLED:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MQTT_USERNAME: ingestion_gateway
      MQTT_PASSWORD: ${MQTT_GATEWAY_PASSWORD:?set MQTT_GATEWAY_PASSWORD in .env (see .env.example)}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach this machine (Linux; built in on Docker Desktop)
    volumes:
      - ./model:/model:ro                      # asset model + mappings: edit, then restart (no rebuild)
    restart: unless-stopped

