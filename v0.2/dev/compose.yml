# Dev setup: gateway + platform + fake test vendors, all on this laptop, from one command.
# Reuses gateway/compose.yml and platform/compose.yml unchanged ("include"); the two small
# *.dev.yml files only add what dev needs on top.
#   https://docs.docker.com/compose/how-tos/multiple-compose-files/include/
#
# From dev/ (passwords: copy .env.example to .env first):
#   docker compose --profile acme up -d --build      broker, gateway, database, historian, Grafana + Acme
#   python smoke_test.py                             is everything working, end to end?
#   docker compose logs -f gateway historian
#   docker compose down                              stop (data kept);  down -v  also deletes the data
#
# Borealis instead of Acme (they pretend to be the same unit):
#   GATEWAY_ENABLED="acme_hvac_0001=off,site4_hvac_01=on" docker compose --profile borealis up -d --build
#
# Stop v0.1 first if it is still running (same port 1883):  cd ../../v0.1 && docker compose down

name: dtteo-dev

include:
  - path: [../gateway/compose.yml, gateway.dev.yml]
    env_file: .env
  - path: [../platform/compose.yml, platform.dev.yml]
    env_file: .env

services:
  acme:
    build: ./vendors
    command: python -u acme_publisher.py
    profiles: ["acme"]
    depends_on: [gateway-broker]
    environment:
      BROKER_HOST: gateway-broker
      MQTT_USERNAME: acme_hvac_0001             # its device slug (gateway/broker/acl.conf)
      MQTT_PASSWORD: ${MQTT_DEVICE_PASSWORD}
    restart: unless-stopped

  borealis:
    build: ./vendors
    command: python -u borealis_publisher.py
    profiles: ["borealis"]
    depends_on: [gateway-broker]
    environment:
      BROKER_HOST: gateway-broker
      MQTT_USERNAME: site4_hvac_01
      MQTT_PASSWORD: ${MQTT_DEVICE_PASSWORD}
    restart: unless-stopped
