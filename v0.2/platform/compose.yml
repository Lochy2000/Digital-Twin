# dt-platform: database, historian, Grafana, backups. Runs on the server, or as part of
# dev/compose.yml on a laptop.
#
# Step B: there is no broker here yet, so on its own the historian waits (and retries) for
# "platform-broker", which step E adds, fed by a bridge from the gateway. In the dev setup
# (dev/platform.dev.yml) the historian reads from the gateway's broker instead.
#
# On its own (from platform/):   copy .env.example to .env, set the passwords, then
#   docker compose up -d --build
#   docker compose logs migrate                 did the migrations apply?
#   docker compose logs -f historian            what's being stored (a summary a minute)
#   http://localhost:3000                       Grafana (admin / GRAFANA_ADMIN_PASSWORD)
#   docker compose run --rm backup              one backup into platform/backups/
#   docker compose exec timescaledb psql -U dtteo_owner -d dtteo     SQL prompt

name: dt-platform

services:
  timescaledb:
    # PostgreSQL 18 + TimescaleDB, exact version pinned. Not the "-oss" tags: they lack the
    # Community features ADR-001 relies on (continuous aggregates, retention policies).
    image: timescale/timescaledb:2.31.0-pg18
    environment:
      POSTGRES_DB: dtteo
      POSTGRES_USER: dtteo_owner                    # owns the tables; used by migrations and backups
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set the passwords in .env (see .env.example)}
      HISTORIAN_DB_PASSWORD: ${HISTORIAN_DB_PASSWORD:?set in .env}   # read by storage/init/10_users.sh
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set in .env}
      TIMESCALEDB_TELEMETRY: "off"                  # don't send usage statistics to the vendor
    volumes:
      # PG18 images keep data in /var/lib/postgresql/18/docker and declare the volume one level
      # up (https://github.com/docker-library/postgres/pull/1259). A named volume, NOT a OneDrive
      # folder: live database files must not be synced.
      - timescale-data:/var/lib/postgresql
      # Creates the login users, first start only. Mount the ONE file: the image's own scripts
      # in that folder must still run.
      - ./storage/init/10_users.sh:/docker-entrypoint-initdb.d/10_users.sh:ro
    # No "ports:": only containers on this Compose network can reach the database.
    # For pgAdmin/DBeaver on this machine, add:  ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtteo_owner -d dtteo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    # dbmate applies any new files in storage/migrations, in order, then exits (ADR-002 section 6).
    image: ghcr.io/amacneil/dbmate:2.37.0
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dtteo_owner:${POSTGRES_PASSWORD}@timescaledb:5432/dtteo?sslmode=disable
    volumes:
      - ./storage/migrations:/db/migrations:ro
    # --no-dump-schema: skip writing schema.sql (needs a pg_dump matching PostgreSQL 18).
    command: ["--migrations-dir", "/db/migrations", "--wait", "--no-dump-schema", "up"]
    restart: "no"

  historian:
    # Writes canonical and quarantine messages into the database (ADR-002 section 7).
    build:
      context: ..                               # v0.2/, so the image can install ../common
      dockerfile: platform/historian/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully     # tables exist before we write
    environment:
      BROKER_HOST: ${BROKER_HOST:-platform-broker}    # step E adds platform-broker; dev points this at the gateway's
      BROKER_PORT: ${BROKER_PORT:-1883}
      MQTT_USERNAME: historian
      MQTT_PASSWORD: ${MQTT_HISTORIAN_PASSWORD:?set in .env}
      DATABASE_URL: postgresql://historian:${HISTORIAN_DB_PASSWORD}@timescaledb:5432/dtteo
      HISTORIAN_SITE: site1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Copy of the gateway's asset model (ADR-003): only used to fill the series table.
      - ./dtteo_asset_model.ttl:/model/dtteo_asset_model.ttl:ro
    restart: unless-stopped

  grafana:
    # "grafana/grafana" is Grafana's recommended image ("grafana-oss" stops updating from 12.4.0).
    image: grafana/grafana:13.2.5
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"        # this machine only. For other lab PCs: "3000:3000", after setting a real admin password
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"      # don't send usage statistics to Grafana Labs
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}  # read by grafana/provisioning/datasources/dtteo.yaml
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped

  backup:
    # Not started by "up". Run on demand:  docker compose run --rm backup
    # Files land in platform/backups/ (git-ignored). On the server, copy them off the machine.
    image: timescale/timescaledb:2.31.0-pg18        # same image, so pg_dump matches the server
    profiles: ["backup"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGHOST: timescaledb
      PGUSER: dtteo_owner
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: dtteo
    volumes:
      - ./storage/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: "no"

volumes:
  timescale-data:
  grafana-data:
