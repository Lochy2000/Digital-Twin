# DT-TEO v0.1 broker access rules (Mosquitto acl_file). Design: contracts/topics.md, "Access rules".
# Format (mosquitto.conf manual, acl_file):
#   user <name>                    the lines below it apply to that login ("not the clientid")
#   topic read|write|readwrite T   read = subscribe and receive; write = publish
#   pattern read|write T           applies to every login; %u = that login's name
# Anything not allowed here is refused.

# Devices log in with their device slug (as in mappings/bindings/site1.ttl), so a device can only
# publish raw data under its own name, and its own online/offline status. Never canonical data.
pattern write raw/+/%u/#
pattern write dt/v1/status/%u

# The front door: reads every device's raw data; the ONLY login that may publish readings.
user ingestion_gateway
topic read raw/#
topic write dt/v1/telemetry/#
topic write dt/v1/quarantine/#

# Reads what it stores. Can't publish data.
user historian
topic read dt/v1/telemetry/#
topic read dt/v1/quarantine/#

# For watching the broker (mosquitto_sub). Read-only.
user engineer
topic read raw/#
topic read dt/v1/#
