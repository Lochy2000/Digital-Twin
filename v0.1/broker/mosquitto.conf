# v0.1 broker config (Mosquitto 2.0.x).
# Every option below is documented at https://mosquitto.org/man/mosquitto-conf-5.html
listener 1883

# --- Logins and access rules ------------------------------------------------------------
# Every client must log in. broker/start.sh builds both files below at each start:
#   passwords  from the MQTT_* passwords in .env (hashed with mosquitto_passwd)
#   acl        a copy of broker/acl.conf (who may read and write which topics)
# They're created inside the container, owned by Mosquitto's user, readable by no one else.
allow_anonymous false
password_file /mosquitto/auth/passwords
acl_file /mosquitto/auth/acl

# --- Keep queued messages across a broker restart (step 2j) -------------------------------
# The gateway (and later the historian) use persistent sessions: while they're away, the
# broker holds their QoS 1 messages. Without persistence those are kept in memory only
# ("If false, the data will be stored in memory only"), so a broker restart loses them.
persistence true
persistence_location /mosquitto/data/

# Built-in persistence writes a snapshot every autosave_interval seconds (default 1800 = 30 min).
# A crash loses at most this much queued data. 60 s is cheap at feasibility volumes.
# Upgrade path: Mosquitto 2.1's persist-sqlite plugin saves changes as they happen (batched,
# default every 5 s): https://mosquitto.org/documentation/persistence/sqlite/
autosave_interval 60

# How many QoS 1 messages are held PER CLIENT while it is away (default 1000; extra ones are
# dropped). Feasibility rig: about 10 points x 1 a minute = 14,400 a day, so 100,000 covers
# about a week of gateway or historian downtime. Raise it with the point count.
max_queued_messages 100000
