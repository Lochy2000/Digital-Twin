# v0.1 broker config (Mosquitto 2.0.x).
# Every option below is documented at https://mosquitto.org/man/mosquitto-conf-5.html
listener 1883

# Send small packets straight away instead of waiting to bundle them (turns off Nagle's
# algorithm; Mosquitto's default is false). 
#At 50+ messages/s the gateway's output p99 went
# from ~45 ms to 4 ms with this on (experiments E2c, v0.2 fix 5).
set_tcp_nodelay true

# --- Logins and access rules ------------------------------------------------------------
# Every client must log in. broker/start.sh builds both files below at each start:
#   passwords  from the MQTT_* passwords in .env (hashed with mosquitto_passwd)
#   acl        a copy of broker/acl.conf (who may read and write which topics)
# They're created inside the container, owned by Mosquitto's user, readable by no one else.
allow_anonymous false
password_file /mosquitto/auth/passwords
acl_file /mosquitto/auth/acl

# --- Keep queued messages across a broker restart (step 2j) -------------------------------
# The gateway (and later the historian) use persistent sessions: while they're away, the
# broker holds their QoS 1 messages. Without persistence those are kept in memory only
# ("If false, the data will be stored in memory only"), so a broker restart loses them.
persistence true
persistence_location /mosquitto/data/

# Built-in persistence writes a snapshot of everything held in memory. By default it does this
# every autosave_interval SECONDS. Until v0.2 that was 60 s, so a broker crash (not a clean stop)
# lost everything since the last save, sessions included: 3 lost in a plain crash, 577 of 900
# when the historian was away (experiments E4).
#
# v0.2 fix 1: with autosave_on_changes, autosave_interval becomes a COUNT. Mosquitto counts
# "subscription changes, retained messages received and queued messages" and saves once the
# total exceeds it (mosquitto.conf man page). 1 = save after (nearly) every change.
#
# Trade-off: every save rewrites the whole snapshot file. Trivial at lab rates (~10 points a
# minute); costly with a large backlog or thousands of messages/s. Re-check with E4 (crash),
# and E2/E3 (does it slow things down?).
# Scale path: Mosquitto 2.1's persist-sqlite plugin writes only what changed (batched, default
# every 5 s): https://mosquitto.org/documentation/persistence/sqlite/ (2.1 changes some
# defaults and deprecates acl_file/password_file, so it is an upgrade, not a setting).
autosave_on_changes true
autosave_interval 1

# How many QoS 1 messages are held PER CLIENT while it is away (default 1000; extra ones are
# dropped). Feasibility rig: about 10 points x 1 a minute = 14,400 a day, so 100,000 covers
# about a week of gateway or historian downtime. Raise it with the point count.
max_queued_messages 100000
