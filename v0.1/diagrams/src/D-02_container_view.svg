<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 800" width="1190" height="800" role="img" aria-label="D-02 container view of the DT-TEO platform" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap');
    .bg { fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #141618; stroke-width: 1; }
    .bound { fill: none; stroke: #596064; stroke-width: 1; stroke-dasharray: 6 4; }
    .sys { fill: rgba(14,110,104,0.07); stroke: #0E6E68; stroke-width: 2; }
    .conn { fill: none; stroke: #141618; stroke-width: 1.25; }
    .head { fill: #141618; }
    .title { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #141618; }
    .name { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #141618; }
    .desc { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #596064; }
    .lbl { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #141618; }
    .tech { font-family: 'IBM Plex Mono', Consolas, Menlo, monospace; font-size: 10.5px; fill: #596064; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" class="head"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1190" height="800"/>
  <text class="title" x="24" y="34">D-02 · Container view: DT-TEO platform</text>

  <g transform="translate(0,50)">
    <!-- System boundary -->
    <rect class="bound" x="250" y="30" width="760" height="650" rx="2"/>
    <text class="name" x="270" y="56">DT-TEO platform</text>
    <text class="tech" x="404" y="56">[Software system]</text>

    <!-- External: left -->
    <rect class="box" x="24" y="80" width="180" height="80" rx="2"/>
    <text class="name" x="38" y="104">Data sources</text>
    <text class="tech" x="38" y="122">[External systems]</text>
    <text class="desc" x="38" y="142">Sim plant, CSV, devices</text>

    <rect class="box" x="24" y="320" width="180" height="80" rx="2"/>
    <text class="name" x="38" y="344">Engineer</text>
    <text class="tech" x="38" y="362">[Person]</text>
    <text class="desc" x="38" y="382">Monitors, tests scenarios</text>

    <!-- External: right -->
    <rect class="box" x="1040" y="590" width="130" height="70" rx="2"/>
    <text class="name" x="1054" y="614">ML workstation</text>
    <text class="tech" x="1054" y="632">[External]</text>
    <text class="desc" x="1054" y="650">Trains models</text>

    <!-- Left column -->
    <rect class="box" x="330" y="80" width="180" height="80" rx="2"/>
    <text class="name" x="344" y="104">Ingestion gateway</text>
    <text class="tech" x="344" y="122">[Python]</text>
    <text class="desc" x="344" y="142">Adapters, mapping, checks</text>

    <rect class="box" x="330" y="196" width="180" height="72" rx="2"/>
    <text class="name" x="344" y="219">Asset model</text>
    <text class="tech" x="344" y="237">[Turtle file · Brick]</text>
    <text class="desc" x="344" y="256">Point registry, semantics</text>

    <rect class="box" x="330" y="320" width="180" height="80" rx="2"/>
    <text class="name" x="344" y="344">Web UI</text>
    <text class="tech" x="344" y="362">[Grafana · React]</text>
    <text class="desc" x="344" y="382">Dashboards, what-if forms</text>

    <rect class="box" x="330" y="440" width="180" height="80" rx="2"/>
    <text class="name" x="344" y="464">API gateway</text>
    <text class="tech" x="344" y="482">[FastAPI]</text>
    <text class="desc" x="344" y="502">REST + WebSocket</text>

    <!-- Message broker -->
    <rect class="sys" x="610" y="80" width="80" height="440" rx="2"/>
    <text class="name" x="650" y="282" text-anchor="middle">Message</text>
    <text class="name" x="650" y="300" text-anchor="middle">broker</text>
    <text class="tech" x="650" y="324" text-anchor="middle">[Mosquitto]</text>
    <text class="tech" x="650" y="340" text-anchor="middle">MQTT 5</text>

    <!-- Right column -->
    <rect class="box" x="790" y="80" width="190" height="80" rx="2"/>
    <text class="name" x="804" y="104">Twin engine</text>
    <text class="tech" x="804" y="122">[Python]</text>
    <text class="desc" x="804" y="142">RC model, observer</text>

    <rect class="box" x="790" y="190" width="190" height="80" rx="2"/>
    <text class="name" x="804" y="214">Detection &amp; alerts</text>
    <text class="tech" x="804" y="232">[Python]</text>
    <text class="desc" x="804" y="252">Residual checks, alarms</text>

    <rect class="box" x="790" y="300" width="190" height="80" rx="2"/>
    <text class="name" x="804" y="324">Scenario worker</text>
    <text class="tech" x="804" y="342">[Python]</text>
    <text class="desc" x="804" y="362">What-if runs, ML inference</text>

    <rect class="box" x="790" y="410" width="190" height="80" rx="2"/>
    <text class="name" x="804" y="434">Historian</text>
    <text class="tech" x="804" y="452">[Python]</text>
    <text class="desc" x="804" y="472">Records every message</text>

    <!-- Store -->
    <rect class="box" x="330" y="590" width="650" height="70" rx="2"/>
    <text class="name" x="344" y="614">Time-series store</text>
    <text class="tech" x="344" y="632">[TimescaleDB · PostgreSQL]</text>
    <text class="desc" x="344" y="650">Telemetry, twin state, alerts, run history</text>

    <!-- External → platform -->
    <line class="conn" x1="204" y1="120" x2="326" y2="120" marker-end="url(#a)"/>
    <text class="lbl" x="212" y="112">sends readings</text>
    <text class="tech" x="212" y="136">MQTT · CSV · Modbus</text>

    <line class="conn" x1="204" y1="360" x2="326" y2="360" marker-end="url(#a)"/>
    <text class="lbl" x="212" y="352">views, runs what-if</text>

    <!-- Left column links -->
    <line class="conn" x1="420" y1="160" x2="420" y2="192" marker-end="url(#a)"/>
    <text class="lbl" x="428" y="182">looks up points</text>

    <line class="conn" x1="420" y1="400" x2="420" y2="436" marker-end="url(#a)"/>
    <text class="tech" x="428" y="422">REST · WebSocket</text>

    <line class="conn" x1="420" y1="520" x2="420" y2="586" marker-end="url(#a)"/>
    <text class="lbl" x="428" y="550">queries history</text>
    <text class="tech" x="428" y="566">SQL</text>

    <!-- Left column ↔ broker -->
    <line class="conn" x1="510" y1="120" x2="606" y2="120" marker-end="url(#a)"/>
    <text class="lbl" x="560" y="112" text-anchor="middle">readings</text>

    <line class="conn" x1="610" y1="468" x2="514" y2="468" marker-end="url(#a)"/>
    <text class="lbl" x="560" y="460" text-anchor="middle">live updates</text>
    <line class="conn" x1="510" y1="494" x2="606" y2="494" marker-end="url(#a)"/>
    <text class="lbl" x="560" y="510" text-anchor="middle">what-if runs</text>

    <!-- Broker ↔ right column -->
    <line class="conn" x1="690" y1="108" x2="786" y2="108" marker-end="url(#a)"/>
    <text class="lbl" x="740" y="100" text-anchor="middle">readings</text>
    <line class="conn" x1="790" y1="134" x2="694" y2="134" marker-end="url(#a)"/>
    <text class="lbl" x="740" y="150" text-anchor="middle">twin state</text>

    <line class="conn" x1="690" y1="218" x2="786" y2="218" marker-end="url(#a)"/>
    <text class="lbl" x="740" y="210" text-anchor="middle">twin state</text>
    <line class="conn" x1="790" y1="244" x2="694" y2="244" marker-end="url(#a)"/>
    <text class="lbl" x="740" y="260" text-anchor="middle">alerts</text>

    <line class="conn" x1="690" y1="328" x2="786" y2="328" marker-end="url(#a)"/>
    <text class="lbl" x="740" y="320" text-anchor="middle">run requests</text>
    <line class="conn" x1="790" y1="354" x2="694" y2="354" marker-end="url(#a)"/>
    <text class="lbl" x="740" y="370" text-anchor="middle">predictions</text>

    <line class="conn" x1="690" y1="450" x2="786" y2="450" marker-end="url(#a)"/>
    <text class="lbl" x="740" y="442" text-anchor="middle">all messages</text>

    <!-- Historian → store, store → ML -->
    <line class="conn" x1="885" y1="490" x2="885" y2="586" marker-end="url(#a)"/>
    <text class="lbl" x="893" y="534">writes</text>
    <text class="tech" x="893" y="550">SQL</text>

    <line class="conn" x1="980" y1="625" x2="1036" y2="625" marker-end="url(#a)"/>
    <text class="lbl" x="1008" y="617" text-anchor="middle">exports</text>
  </g>

  <!-- Key -->
  <rect class="sys" x="24" y="758" width="22" height="14" rx="2"/>
  <text class="desc" x="54" y="769">Message broker (all broker links are MQTT 5, canonical JSON)</text>
  <line class="conn" x1="480" y1="765" x2="512" y2="765" marker-end="url(#a)"/>
  <text class="desc" x="522" y="769">One-way data flow</text>
  <text class="tech" x="660" y="769">[ ]</text>
  <text class="desc" x="684" y="769">Technology</text>
</svg>
