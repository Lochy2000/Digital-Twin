<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 500" width="1320" height="500" role="img" aria-label="D-09 onboarding: a device type (written once per model), a device binding (one per installed device) and the asset model are combined by the mapper at start-up into one lookup table from raw field to point" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap');
    .bg { fill: #FFFFFF; }
    .card { fill: #FFFFFF; stroke: #141618; stroke-width: 1; }
    .sys { fill: rgba(14,110,104,0.07); stroke: #0E6E68; stroke-width: 2; }
    .conn { fill: none; stroke: #141618; stroke-width: 1.25; }
    .head { fill: #141618; }
    .title { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #141618; }
    .name { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 600; fill: #141618; }
    .name.acc { fill: #0E6E68; }
    .tech { font-family: 'IBM Plex Mono', Consolas, Menlo, monospace; font-size: 10.5px; fill: #596064; }
    .lbl { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #141618; }
    .note { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #596064; }
    .k { font-family: 'IBM Plex Mono', Consolas, Menlo, monospace; font-size: 11.5px; fill: #596064; }
    .v { font-family: 'IBM Plex Mono', Consolas, Menlo, monospace; font-size: 11.5px; fill: #141618; }
    .new { fill: #0E6E68; font-weight: 500; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" class="head"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1320" height="500"/>
  <text class="title" x="24" y="34">D-09 · Onboarding: how a device's field finds its point</text>

  <!-- Device type -->
  <rect class="card" x="24" y="70" width="380" height="168" rx="2"/>
  <text class="name" x="40" y="94">Device type</text>
  <text class="tech" x="40" y="112">[types/eastron_sdm120.ttl · once per model]</text>
  <text class="k" x="40" y="140">decoder</text><text class="v" x="150" y="140">modbus</text>
  <text class="k" x="40" y="160">register</text><text class="v" x="150" y="160">InputRegister 12, float</text>
  <text class="k" x="40" y="180">is a</text><text class="v new" x="150" y="180">brick:Active_Power_Sensor</text>
  <text class="k" x="40" y="200">raw unit</text><text class="v" x="150" y="200">W</text>
  <text class="k" x="40" y="220">also</text><text class="v" x="150" y="220">voltage, current … (optional)</text>

  <!-- Device binding -->
  <rect class="card" x="470" y="70" width="380" height="168" rx="2"/>
  <text class="name" x="486" y="94">Device binding</text>
  <text class="tech" x="486" y="112">[bindings/site1.ttl · one per installed device]</text>
  <text class="k" x="486" y="140">device</text><text class="v" x="596" y="140">sdm120_unit1</text>
  <text class="k" x="486" y="160">type</text><text class="v" x="596" y="160">eastron_sdm120</text>
  <text class="k" x="486" y="180">serves</text><text class="v new" x="596" y="180">unit1</text>
  <text class="k" x="486" y="200">address</text><text class="v" x="596" y="200">modbus+tcp://…:502/1</text>
  <text class="k" x="486" y="220">enabled</text><text class="v" x="596" y="220">yes</text>

  <!-- Asset model -->
  <rect class="card" x="916" y="70" width="380" height="168" rx="2"/>
  <text class="name" x="932" y="94">Asset model</text>
  <text class="tech" x="932" y="112">[dtteo_asset_model.ttl · the building]</text>
  <text class="k" x="932" y="140">unit1</text><text class="v" x="1042" y="140">hasPoint :power</text>
  <text class="k" x="932" y="160">:power is a</text><text class="v new" x="1042" y="160">brick:Active_Power_Sensor</text>
  <text class="k" x="932" y="180">unit</text><text class="v" x="1042" y="180">KiloW</text>
  <text class="k" x="932" y="200">point ID</text><text class="v" x="1042" y="200">unit1.power</text>
  <text class="k" x="932" y="220">expected</text><text class="v" x="1042" y="220">0 … 10 kW</text>

  <!-- binding -> type / asset -->
  <line class="conn" x1="470" y1="160" x2="408" y2="160" marker-end="url(#a)"/>
  <text class="lbl" x="437" y="152" text-anchor="middle">type</text>
  <line class="conn" x1="850" y1="180" x2="912" y2="180" marker-end="url(#a)"/>
  <text class="lbl" x="881" y="172" text-anchor="middle">serves</text>

  <!-- all three -> mapper -->
  <line class="conn" x1="214" y1="238" x2="214" y2="316" marker-end="url(#a)"/>
  <line class="conn" x1="660" y1="238" x2="660" y2="316" marker-end="url(#a)"/>
  <line class="conn" x1="1106" y1="238" x2="1106" y2="316" marker-end="url(#a)"/>
  <text class="lbl" x="222" y="282">how to read it</text>
  <text class="lbl" x="668" y="282">which device, what it serves</text>
  <text class="lbl" x="1114" y="282">which point is there</text>

  <!-- Mapper result -->
  <rect class="sys" x="150" y="320" width="1020" height="92" rx="2"/>
  <text class="name acc" x="168" y="346">Mapper lookup table</text>
  <text class="tech" x="330" y="346">[built once at start-up · same Brick class on the served equipment = match]</text>
  <text class="v" x="168" y="378">(modbus, sdm120_unit1, InputRegister:12)</text>
  <text class="v" x="500" y="378">→</text>
  <text class="v new" x="524" y="378">unit1.power</text>
  <text class="v" x="636" y="378">KiloW (raw W) · expected 0 … 10</text>
  <text class="k" x="168" y="398">Read once per message: a plain dictionary look-up, no searching.</text>

  <text class="note" x="150" y="446">Another meter of the same model: add one binding.  A new model: add one type.</text>
  <text class="note" x="150" y="466">A generic probe (e.g. Tasmota DS18B20) only says "a temperature": its binding names the exact point with dtteo:place.</text>
</svg>
