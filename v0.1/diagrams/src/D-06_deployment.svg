<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 750" width="1290" height="750" role="img" aria-label="D-06 deployment for v0.1: one lab PC runs a Docker Compose project. Only three ports are published: MQTT 1883 for devices, Grafana 3000 for the engineer and the API 8000 for the ML workstation. Six Python services talk to the broker by service name; the database is reachable only inside the project." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap');
    .bg { fill: #FFFFFF; }
    .node { fill: none; stroke: #141618; stroke-width: 1; }
    .node2 { fill: none; stroke: #596064; stroke-width: 1; stroke-dasharray: 6 4; }
    .box { fill: #FFFFFF; stroke: #141618; stroke-width: 1; }
    .port { fill: #0E6E68; }
    .conn { fill: none; stroke: #141618; stroke-width: 1.25; }
    .conn.acc { stroke: #0E6E68; stroke-width: 1.75; }
    .head { fill: #141618; }
    .head.acc { fill: #0E6E68; }
    .title { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #141618; }
    .name { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #141618; }
    .desc { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #596064; }
    .lbl { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #141618; }
    .tech { font-family: 'IBM Plex Mono', Consolas, Menlo, monospace; font-size: 10.5px; fill: #596064; }
    .ptxt { font-family: 'IBM Plex Mono', Consolas, Menlo, monospace; font-size: 10.5px; font-weight: 500; fill: #FFFFFF; }
    .acc-t { font-family: 'IBM Plex Mono', Consolas, Menlo, monospace; font-size: 10.5px; fill: #0E6E68; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" class="head"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" class="head acc"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1290" height="750"/>
  <text class="title" x="24" y="34">D-06 · Deployment: v0.1 on one lab PC</text>

  <!-- Outside the PC (same LAN) -->
  <rect class="box" x="20" y="150" width="230" height="64" rx="2"/>
  <text class="name" x="34" y="174">ESP8266 test board</text>
  <text class="tech" x="34" y="194">[Wi-Fi, local network]</text>

  <rect class="box" x="20" y="300" width="230" height="64" rx="2"/>
  <text class="name" x="34" y="324">Engineer's laptop</text>
  <text class="tech" x="34" y="344">[web browser]</text>

  <rect class="box" x="20" y="452" width="230" height="64" rx="2"/>
  <text class="name" x="34" y="476">ML workstation</text>
  <text class="tech" x="34" y="496">[Python, separate PC]</text>

  <!-- Lab PC -->
  <rect class="node" x="290" y="56" width="970" height="670" rx="2"/>
  <text class="name" x="306" y="80">Lab PC</text>
  <text class="tech" x="360" y="80">[Ubuntu · Docker Engine]</text>

  <!-- Compose project -->
  <rect class="node2" x="330" y="100" width="915" height="610" rx="2"/>
  <text class="name" x="346" y="124">Docker Compose project</text>
  <text class="tech" x="530" y="124">[one internal network; services find each other by name]</text>

  <!-- Published services -->
  <rect class="box" x="360" y="145" width="220" height="78" rx="2"/>
  <text class="name" x="374" y="168">mosquitto</text>
  <text class="tech" x="374" y="186">[eclipse-mosquitto:2]</text>
  <text class="desc" x="374" y="208">Login required, config + data volume</text>

  <rect class="box" x="360" y="295" width="220" height="78" rx="2"/>
  <text class="name" x="374" y="318">grafana</text>
  <text class="tech" x="374" y="336">[grafana/grafana]</text>
  <text class="desc" x="374" y="358">Dashboards, data volume</text>

  <rect class="box" x="360" y="445" width="220" height="78" rx="2"/>
  <text class="name" x="374" y="468">api</text>
  <text class="tech" x="374" y="486">[FastAPI · uvicorn]</text>
  <text class="desc" x="374" y="508">Live via MQTT, history via SQL</text>

  <!-- Published ports (the only ways in) -->
  <rect class="port" x="312" y="174" width="40" height="18" rx="2"/>
  <text class="ptxt" x="332" y="187" text-anchor="middle">1883</text>
  <rect class="port" x="312" y="324" width="40" height="18" rx="2"/>
  <text class="ptxt" x="332" y="337" text-anchor="middle">3000</text>
  <rect class="port" x="312" y="474" width="40" height="18" rx="2"/>
  <text class="ptxt" x="332" y="487" text-anchor="middle">8000</text>

  <line class="conn acc" x1="250" y1="183" x2="308" y2="183" marker-end="url(#aa)"/>
  <text class="lbl" x="258" y="175">MQTT</text>
  <line class="conn acc" x1="250" y1="333" x2="308" y2="333" marker-end="url(#aa)"/>
  <text class="lbl" x="258" y="325">HTTP</text>
  <line class="conn acc" x1="250" y1="483" x2="308" y2="483" marker-end="url(#aa)"/>
  <text class="lbl" x="258" y="475">HTTP</text>

  <!-- Python services group -->
  <rect class="node2" x="640" y="140" width="590" height="310" rx="2"/>
  <text class="name" x="656" y="164">Python services</text>
  <text class="tech" x="780" y="164">[one image each]</text>

  <rect class="box" x="660" y="180" width="260" height="70" rx="2"/>
  <text class="name" x="674" y="204">ingestion-gateway</text>
  <text class="desc" x="674" y="226">Mounts asset model and CSV import</text>
  <text class="desc" x="674" y="242">folder, read-only</text>

  <rect class="box" x="950" y="180" width="260" height="70" rx="2"/>
  <text class="name" x="964" y="204">sim-plant</text>
  <text class="desc" x="964" y="226">Publishes simulated readings</text>

  <rect class="box" x="660" y="270" width="260" height="70" rx="2"/>
  <text class="name" x="674" y="294">twin-engine</text>
  <text class="desc" x="674" y="316">Single instance: keeps live state</text>

  <rect class="box" x="950" y="270" width="260" height="70" rx="2"/>
  <text class="name" x="964" y="294">detection</text>
  <text class="desc" x="964" y="316">Residual checks, alerts</text>

  <rect class="box" x="660" y="360" width="260" height="70" rx="2"/>
  <text class="name" x="674" y="384">scenario-worker</text>
  <text class="desc" x="674" y="406">1 copy now; more can be added</text>

  <rect class="box" x="950" y="360" width="260" height="70" rx="2"/>
  <text class="name" x="964" y="384">historian</text>
  <text class="desc" x="964" y="406">Writes every message to the DB</text>

  <line class="conn" x1="640" y1="184" x2="584" y2="184" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="612" y="176" text-anchor="middle">MQTT</text>

  <!-- Database -->
  <rect class="box" x="640" y="600" width="590" height="70" rx="2"/>
  <text class="name" x="654" y="624">timescaledb</text>
  <text class="tech" x="754" y="624">[timescale/timescaledb, PostgreSQL]</text>
  <text class="desc" x="654" y="648">Port 5432 inside the project only. Data on a named volume.</text>

  <line class="conn" x1="1080" y1="430" x2="1080" y2="596" marker-end="url(#a)"/>
  <text class="lbl" x="1088" y="520">SQL</text>

  <line class="conn" x1="470" y1="523" x2="470" y2="635"/>
  <line class="conn" x1="470" y1="635" x2="636" y2="635" marker-end="url(#a)"/>
  <text class="lbl" x="478" y="580">SQL</text>

  <path class="conn" d="M580 334 H610 V615 H636" marker-end="url(#a)"/>
  <text class="lbl" x="616" y="470">SQL</text>
</svg>
