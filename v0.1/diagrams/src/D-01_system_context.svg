<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="D-01 system context of the DT-TEO platform" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap');
    .bg { fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #141618; stroke-width: 1; }
    .box.later { stroke: #596064; stroke-dasharray: 5 4; }
    .sys { fill: rgba(14,110,104,0.07); stroke: #0E6E68; stroke-width: 2; }
    .conn { fill: none; stroke: #141618; stroke-width: 1.25; }
    .conn.later { stroke: #596064; stroke-dasharray: 5 4; }
    .head { fill: #141618; }
    .head.later { fill: #596064; }
    .title { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #141618; }
    .name { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #141618; }
    .name.big { font-size: 19px; }
    .desc { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #596064; }
    .lbl { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #141618; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" class="head"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" class="head later"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="500"/>
  <text class="title" x="24" y="34">D-01 · System context: DT-TEO platform</text>

  <g transform="translate(0,40)">
    <!-- Inputs -->
    <rect class="box" x="40" y="30" width="210" height="64" rx="2"/>
    <text class="name" x="56" y="58">Simulated plant</text>
    <text class="desc" x="56" y="78">Generates test data</text>

    <rect class="box" x="40" y="122" width="210" height="64" rx="2"/>
    <text class="name" x="56" y="150">Historical data files</text>
    <text class="desc" x="56" y="170">CSV exports</text>

    <rect class="box" x="40" y="214" width="210" height="64" rx="2"/>
    <text class="name" x="56" y="242">Field devices</text>
    <text class="desc" x="56" y="262">ESP8266 test board for now</text>

    <rect class="box later" x="40" y="306" width="210" height="64" rx="2"/>
    <text class="name" x="56" y="334">Forecast services</text>
    <text class="desc" x="56" y="354">Weather and energy prices</text>

    <!-- The system -->
    <rect class="sys" x="390" y="30" width="190" height="340" rx="2"/>
    <text class="name big" x="485" y="186" text-anchor="middle">DT-TEO platform</text>
    <text class="desc" x="485" y="212" text-anchor="middle">Collects data, runs the</text>
    <text class="desc" x="485" y="230" text-anchor="middle">twin, keeps history</text>

    <!-- Outputs -->
    <rect class="box" x="720" y="76" width="200" height="64" rx="2"/>
    <text class="name" x="736" y="104">Engineer</text>
    <text class="desc" x="736" y="124">Monitors, tests scenarios</text>

    <rect class="box" x="720" y="168" width="200" height="64" rx="2"/>
    <text class="name" x="736" y="196">ML workstation</text>
    <text class="desc" x="736" y="216">Trains models offline</text>

    <rect class="box later" x="720" y="260" width="200" height="64" rx="2"/>
    <text class="name" x="736" y="288">Heat / cool equipment</text>
    <text class="desc" x="736" y="308">Receives control settings</text>

    <!-- Arrows in -->
    <line class="conn" x1="250" y1="62" x2="386" y2="62" marker-end="url(#a)"/>
    <text class="lbl" x="318" y="54" text-anchor="middle">simulated readings</text>
    <line class="conn" x1="250" y1="154" x2="386" y2="154" marker-end="url(#a)"/>
    <text class="lbl" x="318" y="146" text-anchor="middle">past data</text>
    <line class="conn" x1="250" y1="246" x2="386" y2="246" marker-end="url(#a)"/>
    <text class="lbl" x="318" y="238" text-anchor="middle">live readings</text>
    <line class="conn later" x1="250" y1="338" x2="386" y2="338" marker-end="url(#al)"/>
    <text class="lbl" x="318" y="330" text-anchor="middle">forecasts</text>

    <!-- Arrows out -->
    <line class="conn" x1="584" y1="108" x2="716" y2="108" marker-start="url(#a)" marker-end="url(#a)"/>
    <text class="lbl" x="650" y="100" text-anchor="middle">dashboards, what-if</text>
    <line class="conn" x1="580" y1="200" x2="716" y2="200" marker-end="url(#a)"/>
    <text class="lbl" x="650" y="192" text-anchor="middle">training data</text>
    <line class="conn later" x1="580" y1="292" x2="716" y2="292" marker-end="url(#al)"/>
    <text class="lbl" x="650" y="284" text-anchor="middle">setpoints</text>
  </g>

  <!-- Key -->
  <line class="conn" x1="40" y1="465" x2="72" y2="465" marker-end="url(#a)"/>
  <text class="desc" x="82" y="469">Built in v0.1</text>
  <line class="conn later" x1="200" y1="465" x2="232" y2="465" marker-end="url(#al)"/>
  <text class="desc" x="242" y="469">Later phase</text>
  <rect class="sys" x="350" y="458" width="22" height="14" rx="2"/>
  <text class="desc" x="382" y="469">What we are building</text>
</svg>
