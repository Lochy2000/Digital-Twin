# Grafana's connection to the DT-TEO database, created automatically at start-up.
# Provisioning format: https://grafana.com/docs/grafana/latest/administration/provisioning/
# PostgreSQL data source options: https://grafana.com/docs/grafana/latest/datasources/postgres/configure/
# Logs in as "grafana", which can only SELECT (storage/migrations, roles and grants).
apiVersion: 1
datasources:
  - name: DT-TEO database
    uid: dtteo-db                 # dashboards refer to this
    type: postgres
    url: timescaledb:5432
    user: grafana
    jsonData:
      database: dtteo
      sslmode: disable            # inside the Compose network only
      timescaledb: true           # lets Grafana's $__timeGroup use time_bucket
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD   # from .env, passed in by docker-compose.yml
    editable: false
